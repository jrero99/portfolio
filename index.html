    <script>
      (function () {
        try {
          // Light by default; dark only when the visitor chose it with the toggle
          var dark = localStorage.getItem("theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.querySelector('meta[name="theme-color"]').content = dark ? "#1f1f1f" : "#fafafa";
        } catch (e) {}
      })();
    </script>
